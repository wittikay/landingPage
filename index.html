<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101719" />
    <meta name="description" content="Wittikay's work and links." />
    <title>wittikay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="#home" aria-label="wittikay home">wittikay</a>
      <nav class="navigation" aria-label="Main navigation">
        <a href="#contact">Contact <span aria-hidden="true">↓</span></a>
        <img class="masthead__logo" src="./images/wittikay-logo.png" alt="" />
      </nav>
    </header>

    <main id="home">
      <section class="hero" aria-labelledby="hero-title">
        <img
          class="hero__photo"
          src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=2400&q=88"
          alt="A city skyline at night, seen from a quiet street"
          fetchpriority="high"
        />
        <div class="hero__shade"></div>
        <div class="hero__content">
          <h1 id="hero-title">These are my works.</h1>
        </div>
      </section>

      <section class="works" id="works" aria-label="Works">
        <div class="works__grid">
          <a
            class="work"
            href="https://wittikay.github.io/se_project_spots/"
            target="_blank"
            rel="noreferrer"
          >
            <span class="work__image"
              ><img src="./images/spots.svg" alt="" loading="lazy"
            /></span>
            <span class="work__name">Spots</span
            ><span class="work__arrow" aria-hidden="true">↗</span>
          </a>
          <a
            class="work"
            href="https://wittikay.github.io/se_project_library_updated/"
            target="_blank"
            rel="noreferrer"
          >
            <span class="work__image"
              ><img src="./images/library.svg" alt="" loading="lazy"
            /></span>
            <span class="work__name">Library</span
            ><span class="work__arrow" aria-hidden="true">↗</span>
          </a>
          <a
            class="work"
            href="https://wittikay.github.io/se_project_coffeeshop/"
            target="_blank"
            rel="noreferrer"
          >
            <span class="work__image"
              ><img
                src="./images/logo_coffeeshop_dark.svg"
                alt=""
                loading="lazy"
            /></span>
            <span class="work__name">Coffeeshop</span
            ><span class="work__arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>

    <footer class="contact" id="contact">
      <span class="contact__label">Contact</span>
      <nav class="contact__links" aria-label="Contact and profile links">
        <a
          href="https://soundcloud.com/wittikay"
          target="_blank"
          rel="noreferrer"
          >SoundCloud <span aria-hidden="true">↗</span></a
        >
        <a href="https://github.com/wittikay" target="_blank" rel="noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
        <a
          href="https://stackoverflow.com/users/21637883/wittikay"
          target="_blank"
          rel="noreferrer"
          >Stack Overflow <span aria-hidden="true">↗</span></a
        >
        <a
          href="https://www.linkedin.com/in/karl-wilson-673289191/"
          target="_blank"
          rel="noreferrer"
          >LinkedIn <span aria-hidden="true">↗</span></a
        >
        <a
          href="https://www.facebook.com/karl.wilson.754365"
          target="_blank"
          rel="noreferrer"
          >Facebook <span aria-hidden="true">↗</span></a
        >
        <a
          href="https://www.codewars.com/users/wittikay"
          target="_blank"
          rel="noreferrer"
          >Codewars <span aria-hidden="true">↗</span></a
        >
      </nav>
    </footer>
  </body>
</html>
